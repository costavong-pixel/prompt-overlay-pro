plugins {
    id "com.android.application"
}

android {
    namespace "com.costavong.promptoverlay"
    compileSdk 36
    // Pin to the locally installed current toolchain so offline beta builds
    // do not fall back to Android Gradle Plugin's older default (35.0.0).
    buildToolsVersion "36.0.0"

    buildFeatures {
        buildConfig true
    }

    // Public identifiers, not secrets. The test binary remains disabled until
    // the real OAuth Web client and backend HTTPS endpoint are configured.
    def trialOauthId = providers.gradleProperty("trialGoogleWebClientId").getOrElse("331034587847-tmnrmmr51la0q4ng5g2bllu50ujr9ufp.apps.googleusercontent.com")
    def trialApiUrl = providers.gradleProperty("trialApiBaseUrl").getOrElse("https://teleprompter-trail.barndai.com")
    if (trialOauthId && !(trialOauthId ==~ /[A-Za-z0-9_-]+\.apps\.googleusercontent\.com/)) {
        throw new GradleException("Invalid trialGoogleWebClientId")
    }
    if (trialApiUrl && !(trialApiUrl ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) {
        throw new GradleException("trialApiBaseUrl must be an HTTPS host (no path)")
    }

    defaultConfig {
        applicationId "com.costavong.promptoverlay"
        minSdk 26
        targetSdk 36
        // Trial identity prototype only. Production still excludes Pro editor.
        versionCode 57
        versionName "2.0.0-pro-alpha21-billing"
        buildConfigField "String", "TRIAL_WEB_CLIENT_ID", "\"${trialOauthId}\""
        buildConfigField "String", "TRIAL_API_URL", "\"${trialApiUrl}\""
        buildConfigField "boolean", "PRO_TEST", "false"
        resValue "string", "app_name", "Prompt Overlay"
        manifestPlaceholders = [proEnabled: "false"]
        testInstrumentationRunner "com.costavong.promptoverlay.pro.ProSmokeRunner"

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        // Optional stable QA signer. Set all variables through local private
        // environment or GitHub Actions secrets, never commit a keystore.
        qa {
            def qaPath = System.getenv("PROMPT_OVERLAY_QA_KEYSTORE")
            if (qaPath != null && !qaPath.trim().isEmpty()) {
                def qaStorePass = System.getenv("PROMPT_OVERLAY_QA_STORE_PASS")
                def qaAlias = System.getenv("PROMPT_OVERLAY_QA_KEY_ALIAS")
                def qaKeyPass = System.getenv("PROMPT_OVERLAY_QA_KEY_PASS")
                if (!qaStorePass || !qaAlias || !qaKeyPass) {
                    throw new GradleException("QA keystore selected but required private signing settings are missing")
                }
                if (!file(qaPath).isFile()) {
                    throw new GradleException("QA keystore file does not exist")
                }
                storeFile file(qaPath)
                storePassword qaStorePass
                keyAlias qaAlias
                keyPassword qaKeyPass
            }
        }
        release {
            def uploadKeystore = System.getenv("PROMPT_OVERLAY_UPLOAD_KEYSTORE")
            if (uploadKeystore != null && !uploadKeystore.trim().isEmpty()) {
                storeFile file(uploadKeystore)
                storePassword System.getenv("PROMPT_OVERLAY_UPLOAD_STORE_PASS")
                keyAlias System.getenv("PROMPT_OVERLAY_UPLOAD_ALIAS") ?: "promptoverlay-upload"
                keyPassword System.getenv("PROMPT_OVERLAY_UPLOAD_KEY_PASS")
            }
        }
    }

    buildTypes {
        debug {
            // Stable QA signing preserves the permanent QA package and
            // lets later builds upgrade the same installation.
            // Without a stable signer, use a *different* isolated temporary
            // package rather than forcing the owner to uninstall Alpha18 and
            // lose device-local projects/scripts.
            if (System.getenv("PROMPT_OVERLAY_QA_KEYSTORE")) {
                signingConfig signingConfigs.qa
                applicationIdSuffix ".protest"
                resValue "string", "app_name", "Prompt Overlay Pro QA"
            } else {
                applicationIdSuffix ".proalpha21"
                resValue "string", "app_name", "Prompt Overlay A21 Preview"
            }
            buildConfigField "boolean", "PRO_TEST", "true"
            manifestPlaceholders = [proEnabled: "true"]
            // Only the side-by-side device test is limited to Samsung's ABI.
            ndk {
                abiFilters providers.gradleProperty("proTestAbi").getOrElse("arm64-v8a")
            }
        }
        release {
            minifyEnabled false
            if (System.getenv("PROMPT_OVERLAY_UPLOAD_KEYSTORE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // Bundled, on-device Latin OCR: works without a network connection and is
    // available immediately after installation.
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "androidx.media3:media3-common:1.11.1"
    implementation "androidx.media3:media3-exoplayer:1.11.1"
    implementation "androidx.media3:media3-ui:1.11.1"
    implementation "androidx.core:core:1.17.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    // Purchase server validation is not yet enabled; do not launch checkout.
    implementation "com.android.billingclient:billing:9.1.0"
    implementation "com.alphacephei:vosk-android:0.3.75@aar"
    implementation "net.java.dev.jna:jna:5.19.1@aar"
    testImplementation "junit:junit:4.13.2"
}
